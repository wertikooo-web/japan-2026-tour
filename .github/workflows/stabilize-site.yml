name: Stabilize site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stabilize:
    if: "!contains(github.event.head_commit.message, '[stable-baseline]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy body scripts
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/stabilize.py
          python /tmp/stabilize.py
      - name: Remove one-time workflow
        run: rm -f .github/workflows/stabilize-site.yml
      - name: Commit stable baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/stabilize-site.yml
          git commit -m "Stabilize site navigation [stable-baseline]"
          git push
