name: Restore site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[site-restored]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore full page
        run: |
          cp legacy.html index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="tabs.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/restore-site.yml
      - name: Commit restored site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-site.yml
          git commit -m "Restore full site and route tabs [site-restored]"
          git push
