name: Apply site text fixes
on:
  push:
    paths:
      - '.github/workflows/text-fixes.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tabs.js')
          s=p.read_text()
          replacements={
            "requestTitle:'ВАШ КАДР В ЯПОНИИ'":"requestTitle:'ВАШ ПУТЬ В ЯПОНИЮ!'",
            "requestTitle:'YOUR JAPAN FRAME'":"requestTitle:'YOUR JOURNEY TO JAPAN!'",
            "requestTitle:'CADRUL VOSTRU DIN JAPONIA'":"requestTitle:'DRUMUL VOSTRU SPRE JAPONIA!'",
            "guideNames:['Andrey Khokhlov','Alexey Ivantsov']":"guideNames:['Andrei Hohlov','Alexei Ivantov']"
          }
          for a,b in replacements.items():
            s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tabs.js
          git commit -m "Update CTA title and organizer names" || true
          git push origin main
