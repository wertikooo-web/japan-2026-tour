name: Repair route tabs v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[tabs-v2]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace malformed navigation patch
        env:
          PATCH_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- robust-tabs-v1 -->'
          if marker in s:
              s=s[:s.index(marker)].rstrip()
              if s.endswith('\\n'):
                  s=s[:-2].rstrip()
          else:
              s=s.replace('</body></html>','').rstrip()
          patch=base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
          p.write_text(s+'\n'+patch,encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/repair-tabs-v2.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/repair-tabs-v2.yml
          git commit -m "Fix route tabs cleanly [tabs-v2]"
          git push
